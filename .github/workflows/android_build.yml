name: Build BAAS Android APK
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-android-apk:
    env:
      JAVA_HOME: /opt/java/openjdk-17
    strategy:
      matrix:
        target_arch: [arm64-v8a, x86_64]
    name: Build BAAS Android APK (${{ matrix.target_arch }})
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Setup Environment
        id: setup_env
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsm6 libxext6 libegl1 patchelf ant autoconf automake ccache lbzip2 libffi-dev libltdl-dev libtool libssl-dev patch pkg-config sudo unzip wget zip adb && sudo rm -rf /var/lib/apt/lists/*
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir scikit-build-core
          python -m pip install -r deploy/android/requirements-build.txt

      - name: Setup Java 17
        id: setup_java
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Generate APK
        id: build_apk
        run: |
          mkdir -p "${ANDROID_SDK_ROOT}/tools/"
          cp -r ${ANDROID_SDK_ROOT}/cmdline-tools/latest/* ${ANDROID_SDK_ROOT}/tools/
          python deploy/android/build.py all --arch ${{ matrix.target_arch }} --android-sdk-path "${ANDROID_SDK_ROOT}" --android-ndk-path "${ANDROID_NDK_LATEST_HOME}" --min-api=24

      - name: Rename APK
        id: rename_apk
        run: |
          mkdir -p bin
          cp boa-debug.apk bin/ 2>/dev/null || true
          cd bin
          REF_NAME="${GITHUB_REF_NAME:-dev}"
          for f in *.apk; do
            base="${f%.apk}"
            mv "$f" "BAAS-${REF_NAME}-${{ matrix.target_arch }}.apk"
          done

      - name: Upload Artifacts
        if: ${{ ( github.event_name == 'push' && github.ref == 'refs/heads/main' ) || github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          path: bin/*.apk
          name: BAAS_Android_${{ matrix.target_arch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BAAS_Android_*
          merge-multiple: true
          path: apks

      - name: Generate Release Notes
        run: |
          echo "## BAAS Android Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### APK 文件" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          for f in apks/*.apk; do
            echo "- $(basename $f)" >> RELEASE_NOTES.md
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: apks/*.apk
          body_path: RELEASE_NOTES.md
